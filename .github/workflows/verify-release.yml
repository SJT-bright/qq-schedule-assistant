name: Verify published desktop downloads
on:
  push:
    branches: [main, 'codex/windows-3-9-6']
    paths: ['.github/workflows/verify-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: SJT-bright/qq-schedule-assistant
    steps:
      - uses: actions/checkout@v4
      - name: Download public release and verify each asset
        run: |
          mkdir downloaded-release
          gh release view v3.9.6 --json tagName,isDraft,isPrerelease,assets,url > release-metadata.json
          gh release download v3.9.6 --dir downloaded-release
          (cd downloaded-release && sha256sum --check SHA256SUMS.txt)
          python3 - <<'PYTHON'
          import hashlib,json,struct,zipfile
          from pathlib import Path
          expected={
            'QQScheduleAssistant-3.9.6-macOS-arm64.zip':'c99bc9eb75c2267a1d480f2ac26a351ff088f0d9f1b45e2ea1b78a56aeb75ab0',
            'QQScheduleAssistant-3.9.6-Windows-x64.exe':'658b19f366780f2076cf03557d2cb894459daa03fdafec2832ff0d01aa9cce87',
            'QQScheduleAssistant-3.9.6-Windows-x64.zip':'31c679aa29496fff28c97c1f3a8afb4ca7683d2ebd20e9c27c79b9b489225251',
            'SHA256SUMS.txt':'450ea1b55756ef9ecb3b81071c4414df49715a5e14e76fd259d237ffe8b6ee93'
          }
          root=Path('downloaded-release'); receipt=[]
          assert {p.name for p in root.iterdir()}==set(expected)
          for name,wanted in expected.items():
              p=root/name; actual=hashlib.sha256(p.read_bytes()).hexdigest()
              assert actual==wanted,(name,actual)
              receipt.append({'file':name,'bytes':p.stat().st_size,'sha256':actual,'matches':True})
              if name.endswith('.zip'):
                  with zipfile.ZipFile(p) as z:
                      assert z.testzip() is None
                      assert not any('library.sqlite3' in n or 'session.enc' in n or 'permission-status.json' in n for n in z.namelist())
                      if 'Windows' in name:
                          b=z.read(next(n for n in z.namelist() if n.endswith('QQ排程助手.exe')))
                          off=struct.unpack_from('<I',b,0x3c)[0]
                          assert b[off:off+4]==b'PE\0\0' and struct.unpack_from('<H',b,off+4)[0]==0x8664
                          assert any(n.endswith('app.asar.unpacked/native/QQBridge.ps1') for n in z.namelist())
          Path('download-verification.json').write_text(json.dumps({'tag':'v3.9.6','source':'GitHub Release download','verified':True,'assets':receipt},ensure_ascii=False,indent=2))
          print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: Release-download-verification
          path: |
            download-verification.json
            release-metadata.json
