name: Publish desktop release
on:
  push:
    tags: ['v3.9.6']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 393e54fe2709366697f673a4f7f7ccf27d8c7b79
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the tested Windows source
        run: |
          test "$(git rev-parse HEAD:Windows)" = "$(git rev-parse $SOURCE_SHA:Windows)"
      - name: Download successful Windows build
        run: |
          test "$(gh run view 38268485718 --json conclusion --jq .conclusion)" = success
          gh run download 38268485718 --name Windows-3.9.6-build116 --dir downloaded
      - name: Prepare data-free release assets
        run: |
          mkdir -p release
          cp downloaded/dist/windows/*.exe downloaded/dist/windows/*.zip release/
          cp ReleaseAssets/QQScheduleAssistant-3.9.6-macOS-arm64.zip release/
          echo 'c99bc9eb75c2267a1d480f2ac26a351ff088f0d9f1b45e2ea1b78a56aeb75ab0  release/QQScheduleAssistant-3.9.6-macOS-arm64.zip' | sha256sum --check
          python3 - <<'PYTHON'
          import zipfile,json,struct
          from pathlib import Path
          for file in Path('release').glob('*.zip'):
              with zipfile.ZipFile(file) as z:
                  assert not any('library.sqlite3' in n or 'session.enc' in n or 'permission-status.json' in n for n in z.namelist())
                  if 'Windows' in file.name:
                      exe=next(n for n in z.namelist() if n.endswith('QQ排程助手.exe'))
                      b=z.read(exe);off=struct.unpack_from('<I',b,0x3c)[0]
                      assert b[off:off+4]==b'PE\0\0' and struct.unpack_from('<H',b,off+4)[0]==0x8664
          PYTHON
          (cd release && sha256sum *.exe *.zip > SHA256SUMS.txt)
      - name: Publish verified binaries
        run: |
          gh release create v3.9.6 --verify-tag --title 'QQ排程助手 v3.9.6 · macOS + Windows 候选版' --notes-file .github/RELEASE_NOTES.md release/*
      - uses: actions/upload-artifact@v4
        with:
          name: Published-3.9.6
          path: release/
